name: Repo Updater BETA

on:
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'Solo sincronizar y firmar (Saltar compilación)'
        required: true
        type: boolean
        default: false
      packages:
        description: 'Paquetes a compilar (separados por comas: pkg1, pkg2)'
        required: false
        type: string
        default: ''
      migrate_sf:
        description: 'Migrar TODO desde SourceForge a GitHub'
        required: true
        type: boolean
        default: false
        
permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    container:
      image: 'ghcr.io/void-linux/void-mklive:20250116R1'
      options: --privileged

    steps:
      - name: Fix SSL and install tools
        run: |
          xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/ xbps
          xbps-install -Suyd --repository=https://repo-de.voidlinux.org/current/
          xbps-install -y --repository=https://repo-de.voidlinux.org/current/ wget nodejs ca-certificates ntp git base-devel xtools sudo rsync openssh sshpass python3 python3-pip tar curl jq github-cli
          
          python3 -m pip install -U "huggingface_hub[cli]" --break-system-packages
          
          groupadd -f xbuilder
          useradd -m -s /bin/bash -G xbuilder builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Clone void-packages and template
        run: |
          git clone --depth 1 https://github.com/void-linux/void-packages.git /tmp/void-packages
          cd /tmp/void-packages
          git clone https://github.com/Neko-Void-Linux/cnr.git custompkgs
          cp -rf custompkgs/* srcpkgs/
          echo "#nnothing" >> common/build-style/none.sh
          echo "libscenefx-0.5.so scenefx-latest-0.5_1" >> common/shlibs
          echo "libQt6Pas.so.6 libqt6pas-bin-6.2.10_1" >> common/shlibs
          chown -R builder:builder /tmp/void-packages

      - name: Download existing repo
        env:
          SFTP_USER: ${{ secrets.SFTP_USERNAME }}
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/void-packages/hostdir/binpkgs
          cd /tmp/void-packages/hostdir/binpkgs
          
          if [ "${{ inputs.migrate_sf }}" = "true" ]; then
            echo "Migrando desde SourceForge..."
            sshpass -e rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" ${SFTP_USER}@frs.sourceforge.net:/home/frs/project/neko-void/repo/ .
          else
            echo "Descargando estado actual desde GitHub Releases..."
            gh release download stable --dir . --pattern "*" || echo "El release stable no existe o esta vacio. Se creara en el paso de despliegue."
          fi

      - name: Fix permissions for builder
        run: chown -R builder:builder /tmp/void-packages
        
      - name: Build package
        if: ${{ !inputs.sync_only && inputs.packages != '' }}
        shell: bash
        run: |
          su - builder -c "cd /tmp/void-packages && ./xbps-src binary-bootstrap"
          IFS=',' read -ra PKGS <<< "${{ inputs.packages }}"
          for pkg in "${PKGS[@]}"; do
            pkg=$(echo "$pkg" | xargs)
            if [ -n "$pkg" ]; then
              echo "Compilando paquete: $pkg"
              su - builder -c "cd /tmp/void-packages && ./xbps-src pkg $pkg"
            fi
          done

      - name: Sign packages and index
        run: |
          echo "${{ secrets.XBPS_PRIVATE_KEY }}" > /tmp/privkey.pem
          cd /tmp/void-packages/hostdir/binpkgs
          rm -f x86_64-repodata
          rm -f *.sig2
          rm -f *.sig
          xbps-rindex --sign-pkg --privkey /tmp/privkey.pem *.xbps
          xbps-rindex -a *.xbps
          xbps-rindex --sign --signedby "javierc" --privkey /tmp/privkey.pem .
          rm /tmp/privkey.pem

      - name: Deploy to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 1. Agregar excepción de seguridad para Git
          git config --global --add safe.directory '*'
          
          cd /tmp/void-packages/hostdir/binpkgs
          
          # Activar nullglob
          shopt -s nullglob
          
          # Recopilar todos los paquetes, índices y firmas
          ARCHIVOS=()
          for f in *.xbps *.sig *.sig2 *-repodata*; do
            if [ -f "$f" ]; then
              ARCHIVOS+=("$f")
            fi
          done
          
          if [ ${#ARCHIVOS[@]} -eq 0 ]; then
            echo "No hay archivos para subir al release."
            exit 0
          fi
          
          # 2. Especificar explícitamente tu repositorio
          REPO="${{ github.repository }}"
          
          if gh release view stable --repo "$REPO" >/dev/null 2>&1; then
            echo "El release existe. Subiendo y sobreescribiendo archivos en $REPO..."
            gh release upload stable "${ARCHIVOS[@]}" --clobber --repo "$REPO"
          else
            echo "Creando nuevo release stable en $REPO..."
            gh release create stable "${ARCHIVOS[@]}" --title "Stable Release" --notes "Repositorio oficial de paquetes para Neko Void" --repo "$REPO"
          fi
          
      - name: Compress and upload to Hugging Face 
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd /tmp/void-packages/hostdir/binpkgs
          VERSION=$(date +"%Y%m%d")
          tar -czvf /tmp/neko-packages.tar.gz .
          hf upload arepaconcafe/repo /tmp/neko-packages.tar.gz test-$VERSION.tar.gz --repo-type dataset --token $HF_TOKEN
